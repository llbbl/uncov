name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.next }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine next version
        id: version
        run: |
          next=$(bun run ./scripts/release-policy.ts next)
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [[ -z "$next" ]]; then
            echo "No release needed"
            exit 0
          fi
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Install Just
        if: steps.version.outputs.next != ''
        uses: extractions/setup-just@v2

      - name: Update versions
        if: steps.version.outputs.next != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          just set-version "$VERSION"

      - name: Verify
        if: steps.version.outputs.next != ''
        run: |
          bun run lint
          bun test

      - name: Commit and tag
        if: steps.version.outputs.next != ''
        env:
          TAG: ${{ steps.version.outputs.next }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): bump version to v$VERSION"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact: uncov-linux-x64
          - target: darwin-arm64
            os: macos-latest
            artifact: uncov-darwin-arm64
          - target: darwin-x64
            os: macos-latest
            artifact: uncov-darwin-x64
          - target: windows-x64
            os: windows-latest
            artifact: uncov-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build --compile --target=bun-${{ matrix.target }} --outfile=dist/${{ matrix.artifact }} ./src/cli.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/*-linux-* release/*-darwin-* || true
          ls -la release/

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release/*
          body: ${{ steps.changelog.outputs.content }}
          draft: false
          prerelease: false
